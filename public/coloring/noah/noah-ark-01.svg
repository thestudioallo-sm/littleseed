<?xml version="1.0" encoding="UTF-8"?>
<!--
  LittleSeed — Noah and the Ark
  Free Bible Coloring Sheet | littleseed.app
  Bible reference: Genesis 6:9-22
  Age group: Early (5-7) | Difficulty: Easy
  Optimised for print at A4 / US Letter
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 595 842"
  width="595" height="842"
  aria-label="Noah and the Ark coloring sheet"
  role="img"
>
  <!-- Background (leave white for printing) -->
  <rect width="595" height="842" fill="white"/>

  <!-- ── Title ── -->
  <text x="297" y="48"
    font-family="-apple-system, Arial, sans-serif"
    font-size="26" font-weight="bold"
    text-anchor="middle" fill="none"
    stroke="#000" stroke-width="1.2">Noah and the Ark</text>

  <!-- ── Sky / clouds ── -->
  <!-- Cloud 1 -->
  <g stroke="#000" stroke-width="2.5" fill="none">
    <ellipse cx="100" cy="115" rx="42" ry="28"/>
    <ellipse cx="135" cy="105" rx="35" ry="24"/>
    <ellipse cx="165" cy="115" rx="30" ry="20"/>
  </g>
  <!-- Cloud 2 -->
  <g stroke="#000" stroke-width="2.5" fill="none">
    <ellipse cx="430" cy="100" rx="48" ry="30"/>
    <ellipse cx="468" cy="90"  rx="36" ry="26"/>
    <ellipse cx="500" cy="100" rx="28" ry="18"/>
  </g>
  <!-- Sun rays -->
  <g stroke="#000" stroke-width="2.5" fill="none">
    <circle cx="297" cy="95" r="28"/>
    <line x1="297" y1="55"  x2="297" y2="45"/>
    <line x1="297" y1="135" x2="297" y2="145"/>
    <line x1="257" y1="95"  x2="247" y2="95"/>
    <line x1="337" y1="95"  x2="347" y2="95"/>
    <line x1="269" y1="67"  x2="262" y2="60"/>
    <line x1="325" y1="123" x2="332" y2="130"/>
    <line x1="325" y1="67"  x2="332" y2="60"/>
    <line x1="269" y1="123" x2="262" y2="130"/>
  </g>

  <!-- ── Water waves ── -->
  <g stroke="#000" stroke-width="2.8" fill="none">
    <!-- Water surface -->
    <path d="M0,580 Q60,560 120,580 Q180,600 240,580 Q300,560 360,580 Q420,600 480,580 Q540,560 595,580"/>
    <path d="M0,605 Q70,588 140,605 Q210,622 280,605 Q350,588 420,605 Q490,622 595,605"/>
    <path d="M0,630 Q80,615 160,630 Q240,645 320,630 Q400,615 480,630 Q540,640 595,630"/>
    <!-- Deeper water -->
    <path d="M0,655 Q100,645 200,655 Q300,665 400,655 Q500,645 595,655"/>
    <path d="M0,678 Q120,668 240,678 Q360,688 480,678 Q540,672 595,678"/>
  </g>
  <!-- Water fill hint (light lines) -->
  <rect x="0" y="580" width="595" height="262" fill="none" stroke="none"/>

  <!-- ── Ark hull ── -->
  <g stroke="#000" stroke-width="3" fill="none">
    <!-- Main hull -->
    <path d="M100,540 Q120,600 150,620 L445,620 Q475,600 495,540 Z"/>
    <!-- Hull planks (horizontal lines) -->
    <line x1="115" y1="568" x2="480" y2="568"/>
    <line x1="125" y1="592" x2="470" y2="592"/>
    <!-- Bow detail -->
    <path d="M150,540 L150,620"/>
    <path d="M445,540 L445,620"/>
    <!-- Keel line -->
    <path d="M100,540 L495,540"/>
  </g>

  <!-- ── Ark cabin ── -->
  <g stroke="#000" stroke-width="3" fill="none">
    <!-- Main cabin box -->
    <rect x="155" y="420" width="285" height="120" rx="4"/>
    <!-- Cabin roof (arched) -->
    <path d="M145,420 Q297,360 450,420"/>
    <!-- Roof ridge line -->
    <line x1="297" y1="368" x2="297" y2="420"/>
    <!-- Window left -->
    <rect x="185" y="450" width="55" height="55" rx="6"/>
    <!-- Window center -->
    <rect x="269" y="450" width="57" height="55" rx="6"/>
    <!-- Window right -->
    <rect x="355" y="450" width="55" height="55" rx="6"/>
    <!-- Door -->
    <path d="M278,540 L278,478 Q297,468 316,478 L316,540"/>
    <!-- Door arch -->
    <path d="M278,478 Q297,462 316,478"/>
    <!-- Cabin wood planks -->
    <line x1="155" y1="455" x2="440" y2="455"/>
    <line x1="155" y1="490" x2="440" y2="490"/>
  </g>

  <!-- ── Animals on the gangplank ── -->
  <!-- Gangplank -->
  <g stroke="#000" stroke-width="2.5" fill="none">
    <path d="M445,540 L530,490"/>
    <line x1="460" y1="532" x2="475" y2="522"/>
    <line x1="480" y1="520" x2="495" y2="510"/>
    <line x1="500" y1="508" x2="515" y2="498"/>
  </g>

  <!-- Elephant (simple, chunky, easy to colour) -->
  <g stroke="#000" stroke-width="2.5" fill="none" transform="translate(65,430)">
    <!-- body -->
    <ellipse cx="0" cy="60" rx="38" ry="28"/>
    <!-- head -->
    <circle cx="-22" cy="38" r="20"/>
    <!-- ear -->
    <ellipse cx="-38" cy="36" rx="12" ry="16"/>
    <!-- trunk -->
    <path d="M-34,48 Q-52,58 -48,75 Q-46,82 -38,80"/>
    <!-- legs -->
    <rect x="-30" y="82" width="14" height="22" rx="5"/>
    <rect x="-8"  y="82" width="14" height="22" rx="5"/>
    <rect x="12"  y="82" width="14" height="22" rx="5"/>
    <!-- eye -->
    <circle cx="-26" cy="34" r="3"/>
    <!-- tusk -->
    <path d="M-34,45 Q-44,50 -40,58"/>
  </g>

  <!-- Giraffe (right side, head raised) -->
  <g stroke="#000" stroke-width="2.5" fill="none" transform="translate(490,360)">
    <!-- body -->
    <ellipse cx="0" cy="100" rx="22" ry="35"/>
    <!-- neck -->
    <path d="M-14,68 L-20,0"/>
    <path d="M8,72  L14,-4"/>
    <!-- head -->
    <ellipse cx="-3" cy="-12" rx="14" ry="10"/>
    <!-- horns -->
    <line x1="-8"  y1="-20" x2="-10" y2="-34"/>
    <line x1="2"   y1="-22" x2="4"   y2="-36"/>
    <!-- eye -->
    <circle cx="-8" cy="-12" r="2.5"/>
    <!-- ears -->
    <path d="M5,-14 Q12,-22 14,-12"/>
    <!-- legs -->
    <line x1="-16" y1="132" x2="-16" y2="178"/>
    <line x1="-6"  y1="132" x2="-6"  y2="178"/>
    <line x1="6"   y1="132" x2="6"   y2="178"/>
    <line x1="16"  y1="132" x2="16"  y2="178"/>
    <!-- hooves -->
    <ellipse cx="-16" cy="180" rx="6" ry="4"/>
    <ellipse cx="-6"  cy="180" rx="6" ry="4"/>
    <ellipse cx="6"   cy="180" rx="6" ry="4"/>
    <ellipse cx="16"  cy="180" rx="6" ry="4"/>
    <!-- spots (for colouring) -->
    <ellipse cx="-5"  cy="80"  rx="7" ry="6"/>
    <ellipse cx="10"  cy="100" rx="6" ry="5"/>
    <ellipse cx="-12" cy="115" rx="5" ry="7"/>
  </g>

  <!-- Dove with olive branch -->
  <g stroke="#000" stroke-width="2" fill="none" transform="translate(250,175)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="18" ry="12"/>
    <!-- Head -->
    <circle cx="-16" cy="-8" r="9"/>
    <!-- Eye -->
    <circle cx="-19" cy="-10" r="2"/>
    <!-- Beak -->
    <path d="M-24,-8 L-30,-6 L-24,-4"/>
    <!-- Wing up -->
    <path d="M0,-12 Q20,-30 35,-20 Q20,-8 0,0"/>
    <!-- Tail -->
    <path d="M16,4 Q28,14 24,22 Q18,16 12,12"/>
    <!-- Olive branch in beak -->
    <path d="M-28,-6 L-42,0"/>
    <ellipse cx="-36" cy="-3" rx="5" ry="3" transform="rotate(-20,-36,-3)"/>
    <ellipse cx="-40" cy="1"  rx="5" ry="3" transform="rotate(10,-40,1)"/>
  </g>

  <!-- ── Rainbow ── -->
  <g stroke="#000" stroke-width="2.5" fill="none">
    <path d="M30,350 Q297,140 565,350"/>
    <path d="M50,360 Q297,162 545,360"/>
    <path d="M70,370 Q297,184 525,370"/>
    <path d="M90,380 Q297,206 505,380"/>
  </g>

  <!-- ── Noah figure (simple outline) ── -->
  <g stroke="#000" stroke-width="2.5" fill="none" transform="translate(297,420)">
    <!-- Robe -->
    <path d="M-20,0 Q-28,60 -22,115 L22,115 Q28,60 20,0 Z"/>
    <!-- Body top -->
    <ellipse cx="0" cy="-5" rx="20" ry="12"/>
    <!-- Head -->
    <circle cx="0" cy="-28" r="18"/>
    <!-- Hair -->
    <path d="M-16,-42 Q-22,-52 -12,-56 Q0,-60 12,-56 Q22,-52 16,-42"/>
    <!-- Beard -->
    <path d="M-14,-14 Q-16,0 -8,6 Q0,8 8,6 Q16,0 14,-14"/>
    <!-- Eyes -->
    <circle cx="-7" cy="-30" r="2.5"/>
    <circle cx="7"  cy="-30" r="2.5"/>
    <!-- Arm raised (waving) -->
    <path d="M18,-2 Q42,-18 48,-34"/>
    <!-- Hand -->
    <circle cx="48" cy="-34" r="6"/>
    <!-- Staff -->
    <line x1="-22" y1="10" x2="-30" y2="115"/>
  </g>

  <!-- ── Verse text (bottom, print-ready) ── -->
  <line x1="40" y1="740" x2="555" y2="740" stroke="#ccc" stroke-width="1"/>
  <text x="297" y="768"
    font-family="-apple-system, Arial, sans-serif"
    font-size="11" text-anchor="middle"
    fill="#333" font-style="italic">
    "Noah was a righteous man… he walked faithfully with God." — Genesis 6:9
  </text>
  <text x="297" y="790"
    font-family="-apple-system, Arial, sans-serif"
    font-size="9" text-anchor="middle" fill="#aaa">
    littleseed.app — Free Bible Coloring Sheets
  </text>

  <!-- Decorative border -->
  <rect x="12" y="12" width="571" height="818"
    fill="none" stroke="#ddd" stroke-width="1.5" rx="6"/>
</svg>
