<?xml version="1.0" encoding="UTF-8"?>
<!--
  LittleSeed — Jonah and the Big Fish
  Free Bible Coloring Sheet | littleseed.app
  Bible reference: Jonah 1:17
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <rect width="600" height="800" fill="#fff"/>

  <!-- Title -->
  <text x="300" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="bold" stroke="none" fill="#000">Jonah and the Big Fish</text>
  <text x="300" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" stroke="none" fill="#333">"The LORD provided a huge fish to swallow Jonah." — Jonah 1:17</text>

  <!-- Wavy ocean lines -->
  <path d="M 40 200 Q 100 180 160 200 T 280 200 T 400 200 T 520 200 T 580 200"/>
  <path d="M 40 240 Q 100 220 160 240 T 280 240 T 400 240 T 520 240 T 580 240"/>
  <path d="M 40 720 Q 100 700 160 720 T 280 720 T 400 720 T 520 720 T 580 720"/>
  <path d="M 40 750 Q 100 730 160 750 T 280 750 T 400 750 T 520 750 T 580 750"/>

  <!-- Whale body -->
  <path d="M 100 480
           Q 80 380 200 360
           Q 350 340 460 380
           Q 530 405 520 460
           Q 540 510 470 540
           Q 350 580 200 560
           Q 80 540 100 480 Z"/>

  <!-- Tail -->
  <path d="M 100 480 L 50 420 L 60 480 L 50 540 L 100 500"/>

  <!-- Eye -->
  <circle cx="430" cy="430" r="12"/>
  <circle cx="432" cy="428" r="4" fill="#000"/>

  <!-- Mouth/smile -->
  <path d="M 410 470 Q 450 490 490 470"/>

  <!-- Belly line -->
  <path d="M 130 510 Q 280 560 460 510"/>

  <!-- Water spout -->
  <path d="M 300 360 Q 290 320 280 290"/>
  <path d="M 300 360 Q 300 320 300 280"/>
  <path d="M 300 360 Q 310 320 320 290"/>
  <circle cx="280" cy="280" r="6"/>
  <circle cx="300" cy="270" r="7"/>
  <circle cx="320" cy="280" r="6"/>

  <!-- Fin -->
  <path d="M 250 560 Q 240 620 280 640 Q 310 620 290 560"/>

  <!-- Small fish friends -->
  <path d="M 480 660 Q 510 650 530 660 Q 510 670 480 660 L 470 650 L 470 670 Z"/>
  <circle cx="510" cy="660" r="2" fill="#000"/>

  <path d="M 80 650 Q 110 640 130 650 Q 110 660 80 650 L 70 640 L 70 660 Z"/>
  <circle cx="110" cy="650" r="2" fill="#000"/>

  <!-- Footer -->
  <text x="300" y="780" text-anchor="middle" font-family="Georgia, serif" font-size="12" stroke="none" fill="#666">littleseed.app — Free to print &amp; share</text>
</svg>
