<?xml version="1.0" encoding="UTF-8"?>
<!--
  LittleSeed — Jesus Loves the Children
  Free Bible Coloring Sheet | littleseed.app
  Bible reference: Matthew 19:14
  Age group: Toddler (2–4) | Difficulty: Very Easy
  Large, bold outlines — easy for small hands to colour
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 595 842"
  width="595" height="842"
  aria-label="Jesus loves the children coloring sheet"
  role="img"
>
  <rect width="595" height="842" fill="white"/>

  <!-- ── Title ── -->
  <text x="297" y="50"
    font-family="-apple-system, Arial, sans-serif"
    font-size="27" font-weight="bold"
    text-anchor="middle" fill="none"
    stroke="#000" stroke-width="1.2">Jesus Loves the Children</text>

  <!-- ── Sun (top-left, large and simple) ── -->
  <g stroke="#000" stroke-width="4" fill="none">
    <circle cx="90" cy="120" r="40"/>
    <!-- Rays -->
    <line x1="90" y1="65"  x2="90"  y2="48"/>
    <line x1="90" y1="175" x2="90"  y2="192"/>
    <line x1="35" y1="120" x2="18"  y2="120"/>
    <line x1="145" y1="120" x2="162" y2="120"/>
    <line x1="51"  y1="81"  x2="39"  y2="69"/>
    <line x1="129" y1="159" x2="141" y2="171"/>
    <line x1="129" y1="81"  x2="141" y2="69"/>
    <line x1="51"  y1="159" x2="39"  y2="171"/>
  </g>

  <!-- ── Clouds (big, simple) ── -->
  <g stroke="#000" stroke-width="4" fill="none">
    <ellipse cx="430" cy="105" rx="60" ry="36"/>
    <ellipse cx="478" cy="90"  rx="45" ry="30"/>
    <ellipse cx="510" cy="108" rx="38" ry="26"/>
  </g>
  <g stroke="#000" stroke-width="4" fill="none">
    <ellipse cx="200" cy="90" rx="45" ry="28"/>
    <ellipse cx="238" cy="76" rx="36" ry="24"/>
  </g>

  <!-- ── Rolling hills (ground) ── -->
  <g stroke="#000" stroke-width="4" fill="none">
    <path d="M0,620 Q150,555 297,610 Q445,665 595,610 L595,842 L0,842 Z"/>
    <!-- Grass tufts -->
    <path d="M80,610  Q85,595 90,610"/>
    <path d="M170,595 Q175,580 180,595"/>
    <path d="M350,625 Q355,610 360,625"/>
    <path d="M460,608 Q465,593 470,608"/>
    <path d="M530,600 Q535,585 540,600"/>
  </g>

  <!-- ══════════════════════════════════════
       JESUS FIGURE (centre, seated, large)
       ══════════════════════════════════════ -->
  <g stroke="#000" stroke-width="4.5" fill="none">
    <!-- Robe body (large, simple shape) -->
    <path d="M220,380 Q200,460 195,610 L400,610 Q398,460 375,380 Z"/>
    <!-- Robe centre fold -->
    <line x1="297" y1="380" x2="297" y2="610"/>
    <!-- Torso -->
    <ellipse cx="297" cy="365" rx="55" ry="38"/>
    <!-- Head -->
    <circle cx="297" cy="285" r="65"/>
    <!-- Hair (long, flowing) -->
    <path d="M235,270 Q225,340 235,390"/>
    <path d="M359,270 Q372,340 362,390"/>
    <!-- Hair top parting -->
    <path d="M245,238 Q297,218 350,238"/>
    <!-- Beard -->
    <path d="M258,320 Q255,355 270,368 Q297,378 324,368 Q339,355 338,320"/>
    <!-- Eyes (large, friendly) -->
    <ellipse cx="278" cy="278" rx="9"  ry="10"/>
    <ellipse cx="316" cy="278" rx="9"  ry="10"/>
    <!-- Smile -->
    <path d="M272,305 Q297,322 322,305"/>
    <!-- Left arm outstretched (welcoming) -->
    <path d="M242,370 Q185,390 148,420"/>
    <!-- Left hand (open) -->
    <ellipse cx="142" cy="426" rx="18" ry="14"/>
    <!-- Right arm outstretched -->
    <path d="M352,370 Q412,390 448,418"/>
    <!-- Right hand -->
    <ellipse cx="454" cy="424" rx="18" ry="14"/>
  </g>

  <!-- ══════════════════════════════════════
       CHILD 1 — left side, running to Jesus
       ══════════════════════════════════════ -->
  <g stroke="#000" stroke-width="3.5" fill="none" transform="translate(60,420)">
    <!-- Body / dress -->
    <path d="M0,0 Q-18,50 -20,130 L20,130 Q18,50 0,0"/>
    <!-- Head -->
    <circle cx="0" cy="-32" r="32"/>
    <!-- Hair (pigtails) -->
    <path d="M-28,-52 Q-42,-60 -38,-44"/>
    <path d="M28,-52  Q42,-60  38,-44"/>
    <!-- Arms reaching forward -->
    <path d="M-18,15 Q-45,5 -52,20"/>
    <path d="M18,15  Q42,20 50,35"/>
    <!-- Legs (running) -->
    <path d="M-10,130 Q-15,165 -18,188"/>
    <path d="M10,130  Q18,158  28,178"/>
    <!-- Feet -->
    <ellipse cx="-20" cy="192" rx="12" ry="7"/>
    <ellipse cx="30"  cy="182" rx="12" ry="7"/>
    <!-- Eyes -->
    <circle cx="-10" cy="-36" r="4"/>
    <circle cx="10"  cy="-36" r="4"/>
    <!-- Smile -->
    <path d="M-10,-20 Q0,-12 10,-20"/>
  </g>

  <!-- ══════════════════════════════════════
       CHILD 2 — right side, arms up joyful
       ══════════════════════════════════════ -->
  <g stroke="#000" stroke-width="3.5" fill="none" transform="translate(490,415)">
    <!-- Body -->
    <path d="M0,0 Q-16,48 -18,128 L18,128 Q16,48 0,0"/>
    <!-- Head -->
    <circle cx="0" cy="-30" r="30"/>
    <!-- Hair (short spiky) -->
    <path d="M-22,-56 Q-18,-68 -10,-58"/>
    <path d="M-8,-62  Q0,-72   8,-62"/>
    <path d="M12,-58  Q20,-68 24,-54"/>
    <!-- Arms raised high -->
    <path d="M-16,10 Q-36,-15 -44,-38"/>
    <path d="M16,10  Q36,-15  44,-38"/>
    <!-- Hands -->
    <ellipse cx="-46" cy="-44" rx="12" ry="10"/>
    <ellipse cx="46"  cy="-44" rx="12" ry="10"/>
    <!-- Legs -->
    <path d="M-8,128 Q-10,162 -12,185"/>
    <path d="M8,128  Q10,162  12,185"/>
    <!-- Feet -->
    <ellipse cx="-13" cy="189" rx="12" ry="7"/>
    <ellipse cx="13"  cy="189" rx="12" ry="7"/>
    <!-- Eyes -->
    <circle cx="-10" cy="-34" r="4"/>
    <circle cx="10"  cy="-34" r="4"/>
    <!-- Big smile -->
    <path d="M-12,-16 Q0,-6 12,-16"/>
  </g>

  <!-- ══════════════════════════════════════
       CHILD 3 — on Jesus's lap (small)
       ══════════════════════════════════════ -->
  <g stroke="#000" stroke-width="3.5" fill="none" transform="translate(297,490)">
    <!-- Body -->
    <ellipse cx="0" cy="20" rx="22" ry="30"/>
    <!-- Head -->
    <circle cx="0" cy="-18" r="28"/>
    <!-- Hair (curly) -->
    <path d="M-24,-40 Q-30,-52 -18,-54 Q-6,-56 0,-44"/>
    <path d="M0,-44  Q6,-56 18,-54 Q30,-52 24,-40"/>
    <!-- Eyes (big) -->
    <circle cx="-10" cy="-22" r="5"/>
    <circle cx="10"  cy="-22" r="5"/>
    <!-- Smile -->
    <path d="M-10,-5 Q0,4 10,-5"/>
    <!-- Arms hugging Jesus -->
    <path d="M-22,10 Q-48,0 -55,-10"/>
    <path d="M22,10  Q48,0  55,-10"/>
    <!-- Legs dangling -->
    <path d="M-10,48 Q-12,75 -14,90"/>
    <path d="M10,48  Q12,75  14,90"/>
    <!-- Feet -->
    <ellipse cx="-15" cy="94" rx="10" ry="6"/>
    <ellipse cx="15"  cy="94" rx="10" ry="6"/>
  </g>

  <!-- ── Flowers in the grass ── -->
  <g stroke="#000" stroke-width="3" fill="none">
    <!-- Flower 1 -->
    <line x1="130" y1="630" x2="130" y2="665"/>
    <circle cx="130" cy="625" r="12"/>
    <circle cx="118" cy="618" r="7"/>
    <circle cx="142" cy="618" r="7"/>
    <circle cx="118" cy="632" r="7"/>
    <circle cx="142" cy="632" r="7"/>
    <!-- Flower 2 -->
    <line x1="450" y1="622" x2="450" y2="658"/>
    <circle cx="450" cy="617" r="12"/>
    <circle cx="438" cy="610" r="7"/>
    <circle cx="462" cy="610" r="7"/>
    <circle cx="438" cy="624" r="7"/>
    <circle cx="462" cy="624" r="7"/>
    <!-- Flower 3 (small) -->
    <line x1="297" y1="660" x2="297" y2="690"/>
    <circle cx="297" cy="655" r="9"/>
    <circle cx="288" cy="650" r="5"/>
    <circle cx="306" cy="650" r="5"/>
    <circle cx="288" cy="660" r="5"/>
    <circle cx="306" cy="660" r="5"/>
  </g>

  <!-- ── Heart shapes floating (love theme) ── -->
  <g stroke="#000" stroke-width="3" fill="none">
    <path d="M155,200 Q155,185 168,185 Q181,185 181,200 Q181,215 155,228 Q129,215 129,200 Q129,185 142,185 Q155,185 155,200"/>
    <path d="M420,170 Q420,157 431,157 Q442,157 442,170 Q442,183 420,194 Q398,183 398,170 Q398,157 409,157 Q420,157 420,170"/>
    <path d="M90,310 Q90,300 98,300 Q106,300 106,310 Q106,320 90,328 Q74,320 74,310 Q74,300 82,300 Q90,300 90,310"/>
    <path d="M510,290 Q510,280 518,280 Q526,280 526,290 Q526,300 510,308 Q494,300 494,290 Q494,280 502,280 Q510,280 510,290"/>
  </g>

  <!-- ── Verse + footer ── -->
  <line x1="40" y1="748" x2="555" y2="748" stroke="#ddd" stroke-width="1"/>
  <text x="297" y="772"
    font-family="-apple-system, Arial, sans-serif"
    font-size="11" text-anchor="middle"
    fill="#333" font-style="italic">
    "Let the little children come to me…" — Matthew 19:14
  </text>
  <text x="297" y="793"
    font-family="-apple-system, Arial, sans-serif"
    font-size="9" text-anchor="middle" fill="#aaa">
    littleseed.app — Free Bible Coloring Sheets
  </text>

  <!-- Border -->
  <rect x="12" y="12" width="571" height="818"
    fill="none" stroke="#ddd" stroke-width="1.5" rx="6"/>
</svg>
