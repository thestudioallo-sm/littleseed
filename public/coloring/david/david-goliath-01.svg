<?xml version="1.0" encoding="UTF-8"?>
<!--
  LittleSeed — David and Goliath
  Free Bible Coloring Sheet | littleseed.app
  Bible reference: 1 Samuel 17:45-50
  Age group: Elementary (7–10) | Difficulty: Medium
  More detail — good for older children
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 595 842"
  width="595" height="842"
  aria-label="David and Goliath coloring sheet"
  role="img"
>
  <rect width="595" height="842" fill="white"/>

  <!-- ── Title ── -->
  <text x="297" y="48"
    font-family="-apple-system, Arial, sans-serif"
    font-size="26" font-weight="bold"
    text-anchor="middle" fill="none"
    stroke="#000" stroke-width="1.2">David and Goliath</text>

  <!-- ── Sky ── -->
  <!-- Clouds -->
  <g stroke="#000" stroke-width="2" fill="none">
    <ellipse cx="80"  cy="95"  rx="40" ry="24"/>
    <ellipse cx="112" cy="84"  rx="32" ry="20"/>
    <ellipse cx="138" cy="95"  rx="28" ry="18"/>
    <ellipse cx="480" cy="88"  rx="44" ry="26"/>
    <ellipse cx="516" cy="76"  rx="34" ry="22"/>
    <ellipse cx="545" cy="90"  rx="26" ry="17"/>
  </g>

  <!-- ── Rocky ground / battlefield ── -->
  <g stroke="#000" stroke-width="3" fill="none">
    <!-- Ground line -->
    <path d="M0,680 Q100,665 200,675 Q297,685 400,670 Q500,658 595,668 L595,842 L0,842 Z"/>
    <!-- Rocks -->
    <ellipse cx="100" cy="674" rx="28" ry="14"/>
    <ellipse cx="90"  cy="668" rx="18" ry="10"/>
    <ellipse cx="480" cy="666" rx="22" ry="11"/>
    <ellipse cx="470" cy="660" rx="14" ry="8"/>
    <!-- Distant hills -->
    <path d="M0,580 Q80,535 160,568 Q240,601 320,558 Q400,515 480,548 Q540,570 595,545"/>
    <path d="M0,610 Q60,585 130,600 Q200,615 270,590 Q340,565 420,585 Q490,600 595,578"/>
  </g>

  <!-- ══════════════════════════════════════
       GOLIATH — left side, massive, armoured
       ══════════════════════════════════════ -->
  <g stroke="#000" stroke-width="3.5" fill="none">

    <!-- Legs (armoured) -->
    <rect x="92"  y="540" width="42" height="130" rx="8"/>
    <rect x="145" y="540" width="42" height="130" rx="8"/>
    <!-- Leg armour detail -->
    <line x1="92"  y1="580" x2="134" y2="580"/>
    <line x1="92"  y1="615" x2="134" y2="615"/>
    <line x1="92"  y1="650" x2="134" y2="650"/>
    <line x1="145" y1="580" x2="187" y2="580"/>
    <line x1="145" y1="615" x2="187" y2="615"/>
    <line x1="145" y1="650" x2="187" y2="650"/>
    <!-- Boots -->
    <path d="M88,665 Q80,680 75,680 L140,680 Q138,665 134,665"/>
    <path d="M143,665 Q140,680 143,680 L193,680 Q190,665 188,665"/>

    <!-- Body / breastplate -->
    <rect x="72" y="350" width="135" height="195" rx="12"/>
    <!-- Armour scales / chevrons on chest -->
    <path d="M90,370 Q139,360 188,370"/>
    <path d="M90,395 Q139,382 188,395"/>
    <path d="M90,420 Q139,408 188,420"/>
    <path d="M90,445 Q139,433 188,445"/>
    <path d="M90,470 Q139,458 188,470"/>
    <path d="M90,495 Q139,483 188,495"/>
    <!-- Centre ridge line -->
    <line x1="139" y1="350" x2="139" y2="545"/>
    <!-- Shoulder pauldrons -->
    <ellipse cx="72"  cy="360" rx="32" ry="20"/>
    <ellipse cx="207" cy="360" rx="32" ry="20"/>

    <!-- Arms -->
    <!-- Right arm (holding spear) -->
    <path d="M207,370 Q240,390 252,440"/>
    <path d="M220,360 Q260,372 268,420"/>
    <!-- Left arm (shield arm) -->
    <path d="M72,370 Q35,398 22,440"/>
    <path d="M62,358 Q30,376 16,428"/>

    <!-- Neck -->
    <rect x="120" y="300" width="40" height="55" rx="8"/>

    <!-- Helmet -->
    <path d="M90,310 Q90,210 139,200 Q188,210 188,310"/>
    <!-- Helmet crest / plume -->
    <path d="M120,205 Q139,170 158,205"/>
    <path d="M125,200 Q139,155 152,200"/>
    <line x1="132" y1="200" x2="128" y2="175"/>
    <line x1="139" y1="200" x2="139" y2="160"/>
    <line x1="146" y1="200" x2="150" y2="175"/>
    <!-- Visor opening -->
    <path d="M100,275 Q139,265 178,275"/>
    <!-- Eyes through visor -->
    <ellipse cx="119" cy="272" rx="8"  ry="6"/>
    <ellipse cx="159" cy="272" rx="8"  ry="6"/>
    <!-- Beard below visor -->
    <path d="M100,295 Q139,310 178,295 Q175,330 139,340 Q103,330 100,295"/>

    <!-- SPEAR (right hand) -->
    <line x1="260" y1="410" x2="280" y2="670"/>
    <!-- Spear tip -->
    <path d="M250,410 L260,390 L270,410"/>
    <!-- Spear grip bands -->
    <line x1="263" y1="450" x2="256" y2="460"/>
    <line x1="268" y1="500" x2="261" y2="510"/>

  </g>

  <!-- ── SHIELD (leaning) ── -->
  <g stroke="#000" stroke-width="3" fill="none">
    <path d="M18,420 Q10,420 8,460 L8,560 Q8,600 18,620 Q28,640 38,620 L38,460 Q38,420 28,420 Z"/>
    <!-- Shield boss (centre knob) -->
    <circle cx="23" cy="520" r="14"/>
    <!-- Shield decorative lines -->
    <path d="M8,480 Q23,470 38,480"/>
    <path d="M8,510 Q23,500 38,510"/>
    <path d="M8,540 Q23,530 38,540"/>
    <path d="M8,570 Q23,560 38,570"/>
  </g>

  <!-- ══════════════════════════════════════
       DAVID — right side, small but bold
       ══════════════════════════════════════ -->
  <g stroke="#000" stroke-width="2.8" fill="none">

    <!-- Legs -->
    <path d="M386,558 Q380,610 376,668"/>
    <path d="M414,558 Q420,608 424,668"/>
    <!-- Sandals -->
    <path d="M368,668 L388,668 L384,680 L372,680 Z"/>
    <path d="M416,668 L436,668 L432,680 L420,680 Z"/>
    <!-- Laces -->
    <line x1="374" y1="670" x2="386" y2="670"/>
    <line x1="424" y1="670" x2="434" y2="670"/>

    <!-- Simple tunic -->
    <path d="M362,430 Q350,500 348,558 L452,558 Q450,500 436,430 Z"/>
    <!-- Tunic belt -->
    <rect x="358" y="492" width="84" height="14" rx="4"/>
    <!-- Tunic hem -->
    <path d="M348,555 Q400,565 452,555"/>

    <!-- Torso -->
    <ellipse cx="400" cy="415" rx="40" ry="30"/>

    <!-- Shepherd's bag (across chest) -->
    <path d="M360,445 Q358,420 365,408"/>
    <ellipse cx="356" cy="448" rx="20" ry="24"/>
    <!-- Bag strap detail -->
    <line x1="358" y1="428" x2="362" y2="432"/>

    <!-- Head -->
    <circle cx="400" cy="345" r="52"/>
    <!-- Hair (curly / young) -->
    <path d="M352,330 Q348,310 360,302 Q370,296 380,306"/>
    <path d="M380,300 Q390,288 400,290 Q410,288 420,300"/>
    <path d="M420,300 Q434,296 444,306 Q452,316 448,330"/>
    <!-- Eyes (determined) -->
    <ellipse cx="384" cy="340" rx="7" ry="7.5"/>
    <ellipse cx="416" cy="340" rx="7" ry="7.5"/>
    <!-- Eyebrows (fierce / brave) -->
    <path d="M373,326 Q384,320 395,326"/>
    <path d="M405,326 Q416,320 427,326"/>
    <!-- Nose -->
    <path d="M396,346 Q393,360 398,364 Q402,366 406,364 Q411,360 408,346"/>
    <!-- Mouth (firm) -->
    <path d="M388,376 Q400,382 412,376"/>

    <!-- Arm swinging sling (right arm raised high) -->
    <path d="M436,420 Q465,390 480,350"/>
    <!-- Forearm + hand -->
    <path d="M478,350 Q490,340 496,330"/>
    <ellipse cx="498" cy="326" rx="12" ry="10"/>

    <!-- Sling strap -->
    <path d="M498,320 Q520,280 530,250 Q535,238 528,232"/>
    <path d="M498,320 Q515,295 518,268 Q520,252 514,244"/>
    <!-- Stone in sling -->
    <ellipse cx="528" cy="240" rx="10" ry="8"/>

    <!-- Left arm / hand extended for balance -->
    <path d="M363,425 Q338,440 322,460"/>
    <ellipse cx="318" cy="464" rx="12" ry="10"/>

  </g>

  <!-- ── Five smooth stones on ground ── -->
  <g stroke="#000" stroke-width="2" fill="none">
    <ellipse cx="320" cy="672" rx="10" ry="7"/>
    <ellipse cx="340" cy="674" rx="9"  ry="6"/>
    <ellipse cx="358" cy="671" rx="8"  ry="6"/>
    <ellipse cx="375" cy="674" rx="9"  ry="6"/>
    <ellipse cx="393" cy="672" rx="10" ry="7"/>
  </g>
  <text x="356" y="695"
    font-family="-apple-system, Arial, sans-serif"
    font-size="9" text-anchor="middle" fill="#888">
    Five smooth stones (1 Samuel 17:40)
  </text>

  <!-- ── Verse + footer ── -->
  <line x1="40" y1="742" x2="555" y2="742" stroke="#ddd" stroke-width="1"/>
  <text x="297" y="765"
    font-family="-apple-system, Arial, sans-serif"
    font-size="10.5" text-anchor="middle"
    fill="#333" font-style="italic">
    "I come against you in the name of the LORD Almighty." — 1 Samuel 17:45
  </text>
  <text x="297" y="786"
    font-family="-apple-system, Arial, sans-serif"
    font-size="9" text-anchor="middle" fill="#aaa">
    littleseed.app — Free Bible Coloring Sheets
  </text>

  <!-- Border -->
  <rect x="12" y="12" width="571" height="818"
    fill="none" stroke="#ddd" stroke-width="1.5" rx="6"/>
</svg>
