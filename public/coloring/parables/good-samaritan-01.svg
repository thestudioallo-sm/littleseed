<?xml version="1.0" encoding="UTF-8"?>
<!--
  LittleSeed — The Good Samaritan
  Free Bible Coloring Sheet | littleseed.app
  Bible reference: Luke 10:36
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <rect width="600" height="800" fill="#fff"/>

  <!-- Title -->
  <text x="300" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="bold" stroke="none" fill="#000">The Good Samaritan</text>
  <text x="300" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" stroke="none" fill="#333">"Which of these three was a neighbor?" — Luke 10:36</text>

  <!-- Sun -->
  <circle cx="500" cy="160" r="40"/>
  <line x1="500" y1="100" x2="500" y2="115"/>
  <line x1="500" y1="205" x2="500" y2="220"/>
  <line x1="440" y1="160" x2="455" y2="160"/>
  <line x1="545" y1="160" x2="560" y2="160"/>

  <!-- Hills -->
  <path d="M 40 500 Q 200 380 360 500"/>
  <path d="M 280 520 Q 440 420 580 520"/>

  <!-- Road -->
  <path d="M 60 700 L 540 700"/>
  <path d="M 80 740 L 520 740"/>
  <line x1="200" y1="720" x2="240" y2="720"/>
  <line x1="320" y1="720" x2="360" y2="720"/>
  <line x1="440" y1="720" x2="480" y2="720"/>

  <!-- Samaritan (standing figure, left) -->
  <circle cx="200" cy="540" r="30"/>
  <!-- head covering -->
  <path d="M 170 540 Q 200 500 230 540"/>
  <!-- body -->
  <path d="M 175 570 L 165 680 L 200 680 L 235 680 L 225 570 Z"/>
  <!-- arm reaching out -->
  <line x1="225" y1="600" x2="290" y2="630"/>
  <!-- legs visible from robe -->
  <line x1="180" y1="680" x2="180" y2="700"/>
  <line x1="220" y1="680" x2="220" y2="700"/>

  <!-- Injured traveler (lying on ground, right) -->
  <ellipse cx="380" cy="660" rx="80" ry="20"/>
  <!-- head -->
  <circle cx="310" cy="650" r="18"/>
  <!-- bandage strip on head -->
  <line x1="292" y1="645" x2="328" y2="645"/>
  <!-- body lines -->
  <path d="M 328 655 L 440 660"/>
  <path d="M 328 670 L 440 670"/>

  <!-- Heart symbol above (kindness) -->
  <path d="M 270 460
           C 260 440 230 440 230 470
           C 230 495 270 520 270 520
           C 270 520 310 495 310 470
           C 310 440 280 440 270 460 Z"/>

  <!-- Small bush -->
  <circle cx="80" cy="660" r="20"/>
  <circle cx="100" cy="650" r="22"/>
  <circle cx="120" cy="660" r="20"/>

  <circle cx="500" cy="660" r="18"/>
  <circle cx="520" cy="650" r="20"/>

  <!-- Footer -->
  <text x="300" y="780" text-anchor="middle" font-family="Georgia, serif" font-size="12" stroke="none" fill="#666">littleseed.app — Free to print &amp; share</text>
</svg>
